name: promptinggo

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prompthub}
      POSTGRES_USER: ${POSTGRES_USER:-prompthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply EF migrations before starting this optional local web container.
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-prompthub};Username=${POSTGRES_USER:-prompthub};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      AllowedHosts: "localhost;127.0.0.1"
      DevelopmentAdmin__Email: ${DEVELOPMENT_ADMIN_EMAIL:-}
      Features__PhoneAuthentication__Enabled: "false"
      UnisenderGo__ApiKey: ${UNISENDER_GO_API_KEY:-}
      UnisenderGo__FromEmail: ${UNISENDER_GO_FROM_EMAIL:-noreply@example.com}
      SmartCaptcha__Enabled: ${SMARTCAPTCHA_ENABLED:-false}
      SmartCaptcha__ClientKey: ${SMARTCAPTCHA_CLIENT_KEY:-}
      SmartCaptcha__ServerKey: ${SMARTCAPTCHA_SERVER_KEY:-}
      Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-support@example.com}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - media_data:/app/App_Data
      - data_protection_keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  postgres_data:
  media_data:
  data_protection_keys:
